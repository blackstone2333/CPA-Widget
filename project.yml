name: CPAWidget
options:
  bundleIdPrefix: com.cpawidget
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 17
    MARKETING_VERSION: 0.5.9
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  configs:
    Release:
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
      GCC_GENERATE_DEBUGGING_SYMBOLS: NO
      DEBUG_INFORMATION_FORMAT: dwarf
      COPY_PHASE_STRIP: YES
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      SWIFT_SERIALIZE_DEBUGGING_OPTIONS: NO
targets:
  CPAWidgetApp:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: Providers
      - path: Services
      - path: Storage
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CPA Widget
        CFBundleName: CPA Widget
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 CPA Widget"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: App/CPAWidget.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cpawidget.app
        PRODUCT_NAME: CPA Widget
        PRODUCT_MODULE_NAME: CPAWidgetApp
        INFOPLIST_KEY_CFBundleIconName: AppIcon
    dependencies:
      - target: CPAWidgetExtension
        embed: true

  CPAWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Core/Models
      - path: Core/Views
      - path: Storage/CacheStore.swift
      - path: Storage/AppSettingsStore.swift
      - path: Resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: CPA Widget Extension
        CFBundleName: CPA Widget Extension
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/CPAWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/CPAWidget/Shared/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cpawidget.app.widget
        PRODUCT_NAME: CPA Widget Extension
        PRODUCT_MODULE_NAME: CPAWidgetExtension
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  CPAWidget:
    build:
      targets:
        CPAWidgetApp: all
        CPAWidgetExtension: all
    run:
      config: Debug
      executable: CPAWidgetApp
    archive:
      config: Release
